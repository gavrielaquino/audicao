# Mantém o projeto do Supabase ativo.
# No plano gratuito, o Supabase pausa o projeto depois de 7 dias sem uso.
# Esta tarefa faz uma consulta simples ao banco a cada 3 dias para evitar a pausa.
# A chave abaixo é a chave pública (publishable), a mesma que já está no index.html.

name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */3 * *"   # a cada 3 dias, às 9h de Brasília
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

permissions:
  actions: write              # necessário para o passo que impede o GitHub de desligar a tarefa

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          status=$(curl -sS -o resposta.txt -w "%{http_code}" \
            "https://djxilypephoyhmjlrqrn.supabase.co/rest/v1/audicoes?select=id&limit=1" \
            -H "apikey: sb_publishable_qqZ4m6bOFwvTrtm9aHDRtw_WqwUGDda")
          echo "Resposta do Supabase: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::O Supabase não respondeu normalmente (HTTP $status). O projeto pode estar pausado: entre no painel do Supabase e clique em Restore project."
            cat resposta.txt
            exit 1
          fi

      # O GitHub desliga tarefas agendadas de repositórios sem atividade por 60 dias.
      # Este passo mantém a tarefa ligada sem criar commits.
      - name: Manter a tarefa ligada
        uses: liskin/gh-workflow-keepalive@v1
